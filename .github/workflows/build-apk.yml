
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Mengambil source code repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # Menginstal Java JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Menginstal Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Memberikan izin eksekusi Gradle Wrapper
      - name: Grant Gradle permission
        run: chmod +x ./gradlew
        working-directory: ./YukKurir

      # Melakukan build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: ./YukKurir

      # Mengunggah hasil APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YukKurir-debug-apk
          path: YukKurir/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
